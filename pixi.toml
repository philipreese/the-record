[workspace]
authors = ["Philip Reese <philipreese@mail.com>"]
channels = ["conda-forge"]
name = "the-record"
platforms = ["win-64", "linux-64"]
version = "0.24.0"

[tasks]
dev = "python backend/scripts/run_dev.py"
dev-backend = "uvicorn --app-dir backend app.main:app --reload"
dev-frontend = "npm --prefix frontend run dev"
test-backend = "python -m unittest discover -s backend/tests"
test-frontend = "npm --prefix frontend run test"
test = "python -m unittest discover -s backend/tests && npm --prefix frontend run test"
check-types = "pyrefly check"
lint = "pyrefly check && npm --prefix frontend run lint"
generate-api-types = "python backend/scripts/generate_openapi.py && npx openapi-typescript backend/openapi.json -o frontend/src/services/api-types.ts"
alembic = "python -m alembic --config backend/alembic.ini"

[dependencies]
python = "3.13.*"
fastapi = "*"
uvicorn = "*"
httpx = "*"
psycopg = ">=3.3.4,<4"
sqlalchemy = ">=2.0.50,<3"
alembic = ">=1.14,<2"
tzdata = "*"

[pypi-dependencies]
pylast = ">=7.0.2, <8"
python-dotenv = ">=1.2.2, <2"
pyrefly = "*"
